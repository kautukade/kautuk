      <a class="navbar-brand" href="index.html">GorBaano</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Shop</a>
            <ul class="dropdown-menu">

          </li>

  <div class="container py-5">
    <h2 class="mb-4">Shop All Products</h2>
    <div class="row">

        <div class="product-card">
          <img src="https://via.placeholder.com/300x300" class="img-fluid" alt="Saree">
          <h5 class="mt-2">Elegant Saree</h5>
          <p>$50</p>
          <button class="btn btn-primary" onclick="addToCart({id:1,name:'Elegant Saree',price:50})">Add to Cart</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="product-card">
          <img src="https://via.placeholder.com/300x300" class="img-fluid" alt="Kurti">

          <p>$30</p>
          <button class="btn btn-primary" onclick="addToCart({id:2,name:'Stylish Kurti',price:30})">Add to Cart</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="product-card">
          <img src="https://via.placeholder.com/300x300" class="img-fluid" alt="Top">
          <h5 class="mt-2">Trendy Top</h5>
          <p>$20</p>
          <button class="btn btn-primary" onclick="addToCart({id:3,name:'Trendy Top',price:20})">Add to Cart</button>
