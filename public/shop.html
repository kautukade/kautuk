<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GorBaano - Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">GorBaano</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="shopDropdown" role="button" data-bs-toggle="dropdown">Shop</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="shop.html">All Products</a></li>
                            <li><a class="dropdown-item" href="shop.html">Dresses</a></li>
                            <li><a class="dropdown-item" href="shop.html">Tops</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="track.html">Track Order</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login/Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart (<span id="cart-total">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4 text-center">Shop</h2>
        <div class="row" id="product-list">
            <div class="col-md-4">
                <div class="card product-card">
                    <img src="https://via.placeholder.com/300x300" class="card-img-top" alt="Product">
                    <div class="card-body">
                        <h5 class="card-title">Sample Dress</h5>
                        <p class="card-text">$40</p>
                        <a href="product.html" class="btn btn-sm btn-outline-secondary">View</a>
                        <button class="btn btn-sm btn-primary" onclick="addToCart(1, 'Sample Dress')">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card product-card">
                    <img src="https://via.placeholder.com/300x300" class="card-img-top" alt="Product">
                    <div class="card-body">
                        <h5 class="card-title">Sample Top</h5>
                        <p class="card-text">$25</p>
                        <a href="product.html" class="btn btn-sm btn-outline-secondary">View</a>
                        <button class="btn btn-sm btn-primary" onclick="addToCart(2, 'Sample Top')">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card product-card">
                    <img src="https://via.placeholder.com/300x300" class="card-img-top" alt="Product">
                    <div class="card-body">
                        <h5 class="card-title">Sample Saree</h5>
                        <p class="card-text">$55</p>
                        <a href="product.html" class="btn btn-sm btn-outline-secondary">View</a>
                        <button class="btn btn-sm btn-primary" onclick="addToCart(3, 'Sample Saree')">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center">
        <div class="container">
            <p>&copy; 2025 GorBaano. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/script.js"></script>
</body>
</html>
